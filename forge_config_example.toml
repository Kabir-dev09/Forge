# Forge TOML configuration.
# Forge loads ~/.config/forge/config.toml.

[font]
# "builtin" is self-contained and uses Forge's prebuilt four-style atlas.
# A fontconfig family name or a direct font file path may be used instead.
family = "builtin"
size = 14.0
nerd_fonts = true
# Optional style overrides accept the same family name or direct style-file paths.
# bold_family = "Iosevka"
# italic_family = "Iosevka"
# bold_italic_family = "Iosevka"

[font.ligatures]
enabled = true
mode = "cursor-aware"
features = ["liga", "clig", "calt"]
max_token_len = 64
cache_entries = 4096

[window]
width = 800
height = 600
opacity = 0.9
title = "Forge"
decorations = true
# Center once after launch on Niri; other Wayland compositors retain normal placement.
center_on_launch = false
padding_balance = "center"
gap = 10
pane_outline_width = 1.0

[window.padding]
top = 8
bottom = 8
left = 8
right = 8

[window.pane_padding]
top = 0
bottom = 0
left = 0
right = 0

[blur]
enabled = true
method = "auto"
radius = 0

[cursor]
style = "beam"
blink = true
blink_rate_ms = 530

[scrollback]
lines = 10000
smooth_scroll = true
scroll_multiplier = 3.0

[shell]
program = "/bin/fish"
# Disabling skips Forge's scripts and command-completion tracking.
integration_enabled = true
args = []

[shell.env]

[behavior]
copy_on_select = false
hide_mouse_when_typing = false
disable_default_keybindings = false

[panes]
mode = "tiling"

[render]
braille_style = "dots"
context_menu_transparent = true

[confirm_close]
background_mode = "opaque_panel"
panel_color = "#0b1020"
selected_color = "#facc15"

[colors]
background = "#141218"
foreground = "#e6e0e9"
cursor_color = "#d0bcff"
selection_bg = "#4f378b"
pane_outline_active = "#89b4fa"
pane_outline_inactive = "#6c7086"

[colors.normal]
black = "#141218"
red = "#ff728f"
green = "#7fff9a"
yellow = "#ffda72"
blue = "#bca5f2"
magenta = "#4e3d76"
cyan = "#d0bcff"
white = "#f4efff"

[colors.bright]
black = "#9d99a5"
red = "#ff9fb2"
green = "#a5ffb8"
yellow = "#ffe7a5"
blue = "#d7c6ff"
magenta = "#ded0ff"
cyan = "#e9e0ff"
white = "#faf8ff"

[status_bar]
enabled = true
position = "top"
placement = "absolute"
background = "#181825"
foreground = "#cdd6f4"

[[status_bar.left]]
[status_bar.left.tabs]
format = " {index}{zoom} "
zoom_indicator = "()"

[status_bar.left.tabs.active]
fg = "#1e1e2e"
bg = "#89b4fa"

[status_bar.left.tabs.inactive]
fg = "#a6adc8"

[[status_bar.left]]
text = " + "
action = "NewTab"

[keybindings]
copy = "ctrl+shift+c"
paste = "ctrl+shift+v"
toggle_fullscreen = "f11"
split_vertical = "ctrl+shift+backslash"
split_horizontal = "ctrl+shift+minus"
toggle_pane_zoom = "ctrl+shift+z"
toggle_sidebar = "ctrl+shift+b"
close_pane = "ctrl+shift+q"
new_tab = "ctrl+shift+t"
close_tab = "ctrl+shift+w"
next_tab = "ctrl+pagedown"
previous_tab = "ctrl+pageup"
