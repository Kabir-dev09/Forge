[font]
# "builtin" uses Forge's embedded JetBrainsMono Nerd Font and prebuilt atlas.
# Installed family names (for example "Iosevka") and font file paths are also supported.
family = "builtin"
size = 14.0
nerd_fonts = true
# Optional style overrides accept the same family name or direct style-file paths.
# bold_family = "Iosevka"
# italic_family = "Iosevka"
# bold_italic_family = "Iosevka"

[font.ligatures]
enabled = false
mode = "cursor-aware"
features = ["liga", "clig", "calt"]
max_token_len = 64
cache_entries = 4096

[window]
width = 800
height = 600
opacity = 1.0
title = "Forge"
decorations = true
# Center once after launch on Niri; other Wayland compositors retain normal placement.
center_on_launch = false
center_grid = true
gap = 0
pane_outline_width = 1.0

[window.padding]
top = 4
bottom = 4
left = 4
right = 4

[window.pane_padding]
top = 0
bottom = 0
left = 0
right = 0

[blur]
enabled = false
method = "auto"

[cursor]
style = "block"
blink = true
blink_rate_ms = 530

[cursor.trail]
enabled = false
# Render the trail as cell-sized opacity bands.
segmented = false
fast_decay_ms = 100
slow_decay_ms = 400
minimum_distance_x = 2
minimum_distance_y = 2
trigger_delay_ms = 50
color = "cursor"

[scrollback]
lines = 10000
smooth_scroll = true
scroll_multiplier = 3.0

[shell]
# program defaults to $SHELL when omitted.
# Disable to skip Forge's CWD and command-lifecycle hooks. Command completion
# indicators are disabled; CWD metadata requires native OSC 7 shell support.
integration_enabled = true
args = []
env = []

[behavior]
copy_on_select = false
disable_default_keybindings = false
hide_mouse_when_typing = false

[panes]
mode = "tiling"

[command_completion_indicator]
mode = "enabled"
minimum_duration_ms = 10000
dismissal = "timeout"
display_duration_ms = 3000
transparent = false

[render]
braille_style = "dots"
context_menu_transparent = false

[confirm_close]
background_mode = "opaque_panel"
panel_color = "#0b1020"
selected_color = "#facc15"

[theme]
background = "#1a1b26"
foreground = "#c0caf5"
popup_background = "#1e1e2e"
cursor_color = "#c0caf5"
selection_bg = "#414868c8"
pane_outline_active = "#89b4fa"
pane_outline_inactive = "#6c7086"

ansi_colors = [
    "#414868", # 0
    "#f7768e", # 1
    "#9ece6a", # 2
    "#e0af68", # 3
    "#7aa2f7", # 4
    "#bb9af7", # 5
    "#7dcfff", # 6
    "#c0caf5", # 7
    "#414868", # 8
    "#f7768e", # 9
    "#9ece6a", # 10
    "#e0af68", # 11
    "#7aa2f7", # 12
    "#bb9af7", # 13
    "#7dcfff", # 14
    "#c0caf5", # 15
]

[statusbar]
enabled = true
position = "bottom"
placement = "inside"
bg_color = "transparent"
fg_color = "#cdd6f4"

[[statusbar.left]]
type = "tabs"
format = " {index}{zoom} "
zoom_indicator = "()"
left_edge = ""
right_edge = ""

[statusbar.left.active]
fg = "#1e1e2e"
bg = "#89b4fa"

[statusbar.left.inactive]
fg = "#a6adc8"

[[statusbar.left]]
type = "text"
text = " + "
action = "NewTab"

[keybinds]
copy = "ctrl+shift+c"
paste = "ctrl+shift+v"
toggle_fullscreen = "f11"
split_vertical = "ctrl+shift+backslash"
split_horizontal = "ctrl+shift+minus"
toggle_pane_zoom = "ctrl+shift+z"
toggle_sidebar = "ctrl+shift+b"
close_pane = "ctrl+shift+q"
new_tab = "ctrl+shift+t"
close_tab = "ctrl+shift+w"
next_tab = "ctrl+pagedown"
previous_tab = "ctrl+pageup"
